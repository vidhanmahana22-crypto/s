<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday</title>

<style>
body{
  margin:0;
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
}

.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.active{display:flex;}

button{
  padding:10px 20px;
  margin-top:20px;
  cursor:pointer;
}

/* LOGIN */
.login-container{
  display:flex;
  gap:40px;
  align-items:center;
}

.login-left img{
  width:200px;
  border-radius:20px;
}

/* CAKE */
.cake{
  width:200px;
  height:120px;
  background:#ff69b4;
  border-radius:10px;
  position:relative;
  cursor:pointer;
}

.cake::before{
  content:"";
  position:absolute;
  top:-40px;
  left:70px;
  width:60px;
  height:40px;
  background:#fff;
  border-radius:10px;
}

.cut{
  background:#aaa !important;
}

/* BALLOONS */
.balloon{
  position:absolute;
  bottom:-100px;
  width:30px;
  height:40px;
  border-radius:50%;
  animation:float 5s linear infinite;
}

@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-120vh);}
}

/* CANDLES */
.candle{
  display:flex;
  gap:20px;
}

.flame{
  width:10px;
  height:20px;
  background:orange;
  border-radius:50%;
}

.off{
  background:gray;
}

.hidden{display:none;}
</style>

</head>

<body>

<!-- LOGIN -->
<div id="page1" class="page active">
<h1>Login 🔐</h1>

<div class="login-container">
<div class="login-left">
<img src="image.jpeg">
</div>

<div>
<p>Enter PIN</p>
<input id="pin" maxlength="4"><br>
<button onclick="checkPin()">Enter</button>
<p id="hint"></p>
</div>
</div>
</div>

<!-- CAKE -->
<div id="page2" class="page">
<h1>🎂 Happy Birthday Samu ❤️</h1>
<p>Cut the cake</p>

<div id="cake" class="cake" onclick="cutCake()"></div>

<div id="balloons"></div>

<button id="next1" class="hidden" onclick="nextPage(3)">Next</button>
</div>

<!-- CANDLES -->
<div id="page3" class="page">
<h1>Make a wish… then blow candles 🕯️</h1>

<div id="candles" class="candle">
<div class="flame"></div>
<div class="flame"></div>
<div class="flame"></div>
</div>

<button onclick="blow()">Blow</button>
<br>
<button onclick="nextPage(4)">Next</button>
</div>

<!-- QUIZ INTRO -->
<div id="page4" class="page">
<h1>Let’s take a test 😏</h1>
<p>How well do you know me?</p>
<button onclick="nextPage(5)">Start</button>
</div>

<!-- YOUR EXISTING CONTENT -->
<div id="page5" class="page">
<h1>Continue your existing pages here</h1>
</div>

<script>

function nextPage(n){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+n).classList.add("active");
}

function checkPin(){
  let val=document.getElementById("pin").value;
  let hint=document.getElementById("hint");

  if(val==="0502"){
    nextPage(2);
  }
  else if(val==="0306"){
    hint.innerText="The pin is not your birthdate Samu, try with birthdate of someone special who lives in Bangalore";
  }
  else{
    hint.innerText="Pin incorrect, try with birthdate of someone special who lives in Bangalore";
  }
}

function cutCake(){
  document.getElementById("cake").classList.add("cut");

  let container=document.getElementById("balloons");

  for(let i=0;i<8;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*100+"vw";
    b.style.background=`hsl(${Math.random()*360},70%,60%)`;
    container.appendChild(b);
  }

  document.getElementById("next1").classList.remove("hidden");
}

function blow(){
  document.querySelectorAll(".flame").forEach(f=>f.classList.add("off"));
}

</script>

</body>
</html>
