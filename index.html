<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Game ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  overflow-x: hidden;
  background: radial-gradient(circle, #1a0033, #000);
  color: white;
}

canvas { position: fixed; top:0; left:0; z-index:-1; }

.page { display:none; padding:30px; }
.active { display:block; }

button {
  padding:12px 20px;
  margin:10px;
  border:none;
  border-radius:25px;
  background: linear-gradient(45deg,#ff4d6d,#ff99ac);
  color:white;
  font-size:16px;
  cursor:pointer;
}

h1 { text-shadow:0 0 15px #ff99cc; }

iframe {
  width:90%;
  height:220px;
  border-radius:15px;
  margin-top:20px;
}

.poem {
  max-width:700px;
  margin:40px auto;
  padding:20px;
  text-align:left;
  line-height:1.7;
  background: rgba(255,255,255,0.05);
  border-radius:15px;
  box-shadow:0 0 20px rgba(255,153,204,0.2);
  white-space:pre-line;
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- ✅ Hidden YouTube Background Music -->
<iframe 
  id="ytMusic"
  width="0" 
  height="0"
  src=""
  frameborder="0"
  allow="autoplay">
</iframe>

<script>
let score = 0;
let total = 10;

function start(){
  // Start music AFTER user click (important)
  document.getElementById("ytMusic").src =
    "https://www.youtube.com/embed/dodDteh-m3Q?autoplay=1&mute=0&loop=1&playlist=dodDteh-m3Q";

  nextPage(2);
}

function nextPage(n){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+n).classList.add("active");

  if(n===12) showResult();
}

function correct(){ score++; }

function annoyingYes(){ alert("Wrong answer 😤 try again"); }

function move(btn){
  btn.style.position="absolute";
  btn.style.left=Math.random()*80+"%";
  btn.style.top=Math.random()*80+"%";
}

function showResult(){
  let text="";

  if(score >= 8){
    text = "Elite performance 😎 clearly you know me too well";
  }
  else if(score >= 5){
    text = "Good good 😏 acceptable effort";
  }
  else if(score >= 3){
    text = "Hmm 🤨 something feels off";
  }
  else{
    text = "Very suspicious behavior 😤 investigation needed";
  }

  document.getElementById("result").innerHTML =
    "Score: " + score + "/" + total + "<br><br>" + text;
}
</script>

<!-- PAGE 1 -->
<div id="page1" class="page active">
<h1>🎉 Happy Birthday ❤️</h1>
<p>Let's test you 😏</p>
<button onclick="start()">Start</button>
</div>

<!-- QUESTIONS -->
<div id="page2" class="page">
<h1>😂 Q1</h1>
<p>Am I annoying?</p>
<button onclick="annoyingYes()">Yes 😅</button>
<button onclick="correct(); nextPage(3)">No 😇</button>
</div>

<div id="page3" class="page">
<h1>😏 Q2</h1>
<p>Your favorite person?</p>
<button onclick="correct(); nextPage(4)">Me 😎</button>
<button onclick="correct(); nextPage(4)">Still me 😂</button>
</div>

<div id="page4" class="page">
<h1>🤭 Q3</h1>
<p>Will you miss me?</p>
<button onclick="correct(); nextPage(5)">Yes 🥺</button>
<button onclick="move(this)">No 😒</button>
</div>

<div id="page5" class="page">
<h1>🎬 Q4</h1>
<p>Best
