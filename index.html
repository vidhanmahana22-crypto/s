<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background: #ffeef5;
  text-align:center;
}

.page { display:none; padding:20px; }
.active { display:block; }

/* LOGIN */
.login-container {
  display:flex;
  height:100vh;
}
.left {
  flex:1;
  background:#ffc0cb;
}
.right {
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.pin-boxes {
  display:flex;
  gap:10px;
  margin-bottom:20px;
}
.box {
  width:40px;
  height:50px;
  border:2px solid black;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.keypad {
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:10px;
}
.key {
  padding:15px;
  background:white;
  border:1px solid black;
  cursor:pointer;
}

/* CAKE */
.cake {
  width:200px;
  height:120px;
  background:brown;
  margin:50px auto;
  position:relative;
  border-radius:10px;
}

.candle {
  width:10px;
  height:40px;
  background:white;
  position:absolute;
  top:-40px;
}

.flame {
  width:10px;
  height:10px;
  background:yellow;
  border-radius:50%;
  margin:auto;
}

.hidden { display:none; }

/* KNIFE */
#knife {
  width:80px;
  position:absolute;
  left:50px;
  top:300px;
  cursor:grab;
}

/* BALLOONS */
.balloon {
  width:40px;
  height:50px;
  background:red;
  border-radius:50%;
  position:absolute;
  bottom:-60px;
  animation:float 5s linear forwards;
}

@keyframes float {
  to { transform:translateY(-800px); }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login" class="page active">
  <div class="login-container">
    <div class="left"></div>
    <div class="right">

      <div class="pin-boxes">
        <div class="box" id="b0"></div>
        <div class="box" id="b1"></div>
        <div class="box" id="b2"></div>
        <div class="box" id="b3"></div>
      </div>

      <div class="keypad">
        <div class="key" onclick="press(1)">1</div>
        <div class="key" onclick="press(2)">2</div>
        <div class="key" onclick="press(3)">3</div>
        <div class="key" onclick="press(4)">4</div>
        <div class="key" onclick="press(5)">5</div>
        <div class="key" onclick="press(6)">6</div>
        <div class="key" onclick="press(7)">7</div>
        <div class="key" onclick="press(8)">8</div>
        <div class="key" onclick="press(9)">9</div>
        <div class="key" onclick="clearPin()">C</div>
        <div class="key" onclick="press(0)">0</div>
        <div class="key" onclick="submitPin()">OK</div>
      </div>

      <p id="hint"></p>

    </div>
  </div>
</div>

<!-- BIRTHDAY -->
<div id="birthday" class="page">
  <h1>Happy Birthday Samu 🎉</h1>
  <p>I made something for you ❤️</p>
  <button onclick="next('candles')">Next</button>
</div>

<!-- CANDLES -->
<div id="candles" class="page">
  <h2>Make a wish & blow candles</h2>

  <div class="cake">
    <div class="candle" style="left:40px"><div class="flame"></div></div>
    <div class="candle" style="left:90px"><div class="flame"></div></div>
    <div class="candle" style="left:140px"><div class="flame"></div></div>
  </div>

  <button onclick="blow()">Blow</button>
</div>

<!-- CAKE CUT -->
<div id="cut" class="page">
  <h2>Cut the cake 🎂</h2>

  <div class="cake" id="cake"></div>
  <img src="knife.jpeg" id="knife">

</div>

<!-- BALLOONS -->
<div id="balloons" class="page">
  <h2>Yay 🎈🎈🎈</h2>
  <button onclick="next('quiz')">Next</button>
</div>

<!-- QUIZ -->
<div id="quiz" class="page">
  <h2>Let’s test how well you know me 😉</h2>
</div>

<script>
let pin="";

function press(num){
  if(pin.length<4){
    pin+=num;
    document.getElementById("b"+(pin.length-1)).innerText="*";
  }
}

function clearPin(){
  pin="";
  for(let i=0;i<4;i++) document.getElementById("b"+i).innerText="";
}

function submitPin(){
  if(pin==="0502"){
    next("birthday");
  } else if(pin==="0306"){
    document.getElementById("hint").innerText=
    "Not your birthdate Samu 😉 Try someone special from Bangalore ❤️";
    clearPin();
  } else {
    document.getElementById("hint").innerText=
    "Incorrect pin… try birthdate of someone special from Bangalore ❤️";
    clearPin();
  }
}

function next(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function blow(){
  document.querySelectorAll(".flame").forEach(f=>f.style.display="none");
  setTimeout(()=>next("cut"),1000);
}

/* KNIFE DRAG FIX */
let knife=document.getElementById("knife");
let isDown=false;

knife.onmousedown=()=> isDown=true;
document.onmouseup=()=> isDown=false;

document.onmousemove=(e)=>{
  if(isDown){
    knife.style.left=e.pageX+"px";
    knife.style.top=e.pageY+"px";

    if(e.pageY<250){
      next("balloons");
      releaseBalloons();
      isDown=false;
    }
  }
}

function releaseBalloons(){
  for(let i=0;i<10;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*window.innerWidth+"px";
    document.body.appendChild(b);
  }
}
</script>

</body>
</html>
