<!DOCTYPE html>
<html>
<head>
  <title>Birthday Surprise</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="page active">
  <div class="login-container">
    <div class="left"><img src="image.jpeg"></div>
    <div class="right">
      <h2>Enter PIN 🔐</h2>
      <div id="boxes">
        <span></span><span></span><span></span><span></span>
      </div>
      <div class="keypad">
        <button onclick="press(1)">1</button>
        <button onclick="press(2)">2</button>
        <button onclick="press(3)">3</button>
        <button onclick="press(4)">4</button>
        <button onclick="press(5)">5</button>
        <button onclick="press(6)">6</button>
        <button onclick="press(7)">7</button>
        <button onclick="press(8)">8</button>
        <button onclick="press(9)">9</button>
        <button onclick="clearPin()">C</button>
        <button onclick="press(0)">0</button>
        <button onclick="checkPin()">OK</button>
      </div>
      <p id="msg"></p>
    </div>
  </div>
</div>

<!-- BIRTHDAY -->
<div id="birthday" class="page">
  <div class="bday-container">
    <h1>🎉 Happy Birthday<br><span class="name">Samu</span></h1>
    <p class="subtitle">I made something special just for you ✨</p>
    <button class="fancy-btn" onclick="go('candles')">Start 🎂</button>
  </div>
</div>

<!-- CANDLES -->
<div id="candles" class="page">
  <h2 class="wish-title">Make a wish ✨</h2>
  <div class="cake-scene">
    <!-- candles sit ABOVE cake, absolutely positioned -->
    <div class="candles-above">
      <div class="candle" style="background:red">  <div class="flame"></div></div>
      <div class="candle" style="background:blue"> <div class="flame"></div></div>
      <div class="candle" style="background:green"><div class="flame"></div></div>
      <div class="candle" style="background:orange"><div class="flame"></div></div>
      <div class="candle" style="background:purple"><div class="flame"></div></div>
    </div>
    <div class="cake">
      <div class="cake-dots" id="cakeDots"></div>
    </div>
  </div>
  <button class="fancy-btn" onclick="blow()">🌬️ Blow</button>
</div>

<!-- CAKE CUT -->
<div id="cut" class="page">
  <h2 class="wish-title">Cut the cake 🎂</h2>
  <img id="cakeImg" src="cake.jpeg">
  <img id="knife" src="knife.jpeg">
  <h3 id="yay" style="display:none;">Yay 🎉</h3>
  <button id="nextBtn" class="fancy-btn" style="display:none;" onclick="go('quiz')">Next ➡️</button>
  <div id="balloons"></div>
</div>

<!-- QUIZ -->
<div id="quiz" class="page">
  <h2>Let's see how well you know me 😉</h2>
</div>

<script src="script.js"></script>
</body>
</html>
