<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial;
  text-align:center;
}

.page{
  display:none;
  height:100vh;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}
.active{display:flex;}

button{
  padding:10px 20px;
  margin-top:15px;
  cursor:pointer;
}

/* LOGIN */
.login-container{
  display:flex;
  gap:40px;
  align-items:center;
}

.login-left img{
  width:200px;
  border-radius:20px;
}

/* PIN BOX */
.box{
  width:40px;
  height:50px;
  border:2px solid white;
  border-radius:8px;
  font-size:24px;
  display:flex;
  justify-content:center;
  align-items:center;
}
.box.active{border-color:yellow;}

.keypad{
  display:grid;
  grid-template-columns:repeat(3,60px);
  gap:10px;
  justify-content:center;
}

.keypad button{
  height:60px;
  font-size:20px;
  border:none;
  border-radius:10px;
  background:#222;
  color:white;
}
.keypad button:hover{background:#444;}

/* CAKE */
.cake-container{
  position:relative;
  width:320px;
}
#knife{
  position:absolute;
  width:120px;
  cursor:grab;
}

/* CANDLES */
.cake-top{
  position:relative;
  width:300px;
  height:200px;
  background:linear-gradient(#5a2c1d,#3b1f14);
  border-radius:20px;
}

.candle{
  position:absolute;
  bottom:60px;
  width:12px;
  height:50px;
  background:repeating-linear-gradient(45deg,pink,pink 5px,white 5px,white 10px);
  border-radius:5px;
}

.flame{
  position:absolute;
  top:-18px;
  left:50%;
  transform:translateX(-50%);
  width:10px;
  height:18px;
  background:radial-gradient(circle, yellow 40%, orange 70%);
  border-radius:50%;
  animation:flicker 0.2s infinite alternate;
}

@keyframes flicker{
  from{transform:translateX(-50%) scale(1);}
  to{transform:translateX(-50%) scale(1.2);}
}

.smoke{
  position:absolute;
  top:-25px;
  left:50%;
  transform:translateX(-50%);
  width:8px;
  height:20px;
  background:rgba(200,200,200,0.4);
  border-radius:50%;
  animation:smokeUp 1s forwards;
}

@keyframes smokeUp{
  to{transform:translate(-50%,-40px);opacity:0;}
}

.hidden{display:none;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="page1" class="page active">
<h1>Login 🔐</h1>

<div class="login-container">
<div class="login-left">
<img src="image.jpeg">
</div>

<div>

<div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px;">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>

<p id="hint"></p>

<div class="keypad">
<button onclick="press(1)">1</button>
<button onclick="press(2)">2</button>
<button onclick="press(3)">3</button>

<button onclick="press(4)">4</button>
<button onclick="press(5)">5</button>
<button onclick="press(6)">6</button>

<button onclick="press(7)">7</button>
<button onclick="press(8)">8</button>
<button onclick="press(9)">9</button>

<button onclick="del()">⌫</button>
<button onclick="press(0)">0</button>
<button onclick="checkPin()">✔</button>
</div>

</div>
</div>
</div>

<!-- CAKE CUT -->
<div id="page2" class="page">
<h1>🎂 Happy Birthday ❤️</h1>
<p>Drag knife to cut cake</p>

<div class="cake-container">
  <img id="cake" src="cake.jpeg" width="100%">
  <img id="knife" src="knife.jpeg">
</div>

<button id="next1" class="hidden" onclick="nextPage(3)">Next</button>
</div>

<!-- CANDLES -->
<div id="page3" class="page">
<h1>Make a wish & blow candles 🕯️</h1>

<div class="cake-top" id="cakeTop"></div>

<button onclick="blow()">Blow</button>
<button onclick="nextPage(4)">Next</button>
</div>

<!-- END -->
<div id="page4" class="page">
<h1>Done 🎉</h1>
</div>

<script>

/* PAGE NAV */
function nextPage(n){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById("page"+n).classList.add("active");
}

/* PIN SYSTEM */
let input="";

function updateUI(){
  let boxes=document.querySelectorAll(".box");
  boxes.forEach((b,i)=>{
    b.textContent=input[i]?"•":"";
    b.classList.toggle("active", i===input.length);
  });
}

function press(num){
  if(input.length<4){
    input+=num;
    updateUI();
  }
}

function del(){
  input=input.slice(0,-1);
  updateUI();
}

function checkPin(){
  let hint=document.getElementById("hint");

  if(input==="0502"){
    nextPage(2);
  }else{
    hint.innerText="Wrong PIN 😉";
    input="";
    updateUI();
  }
}

updateUI();

/* KNIFE */
let knife=document.getElementById("knife");
let cake=document.getElementById("cake");
let dragging=false;

knife.addEventListener("mousedown", ()=>dragging=true);
document.addEventListener("mouseup", ()=>dragging=false);

document.addEventListener("mousemove",(e)=>{
  if(dragging){
    knife.style.left=(e.clientX-60)+"px";
    knife.style.top=(e.clientY-60)+"px";

    let rect=cake.getBoundingClientRect();

    if(e.clientX>rect.left && e.clientX<rect.right &&
       e.clientY>rect.top && e.clientY<rect.bottom){

        cake.src="cake_cut.jpeg";
        document.getElementById("next1").classList.remove("hidden");
    }
  }
});

/* CREATE CANDLES */
let cakeTop=document.getElementById("cakeTop");

for(let i=0;i<5;i++){
  let c=document.createElement("div");
  c.className="candle";
  c.style.left=(40 + i*50)+"px";

  let flame=document.createElement("div");
  flame.className="flame";

  c.appendChild(flame);
  cakeTop.appendChild(c);
}

/* BLOW */
function blow(){
  document.querySelectorAll(".flame").forEach(f=>{
    f.remove();

    let smoke=document.createElement("div");
    smoke.className="smoke";
    f.parentElement.appendChild(smoke);
  });
}

</script>

</body>
</html>
